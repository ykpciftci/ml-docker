<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris Prediction</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script>
        // JavaScript function to handle the form submission
        async function submitForm(event) {
            event.preventDefault();  // Prevent the default form submission

            // Get the form data
            const formData = new FormData(event.target);

            // Prepare the data to send to the FastAPI endpoint
            const data = new URLSearchParams();
            for (const [key, value] of formData.entries()) {
                data.append(key, value);
            }

            // Send the data to FastAPI via POST request
            const response = await fetch("/predict", {
                method: "POST",
                body: data
            });

            // Get the JSON response and update the result on the page
            const result = await response.json();
            document.getElementById("prediction").innerText = "Predicted Species: " + result.prediction;
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>Predict Iris Species</h1>
        <form onsubmit="submitForm(event)">
            <label for="SepalLengthCm">Sepal Length (cm):</label>
            <input type="number" step="0.1" name="SepalLengthCm" id="SepalLengthCm" required>

            <label for="SepalWidthCm">Sepal Width (cm):</label>
            <input type="number" step="0.1" name="SepalWidthCm" id="SepalWidthCm" required>

            <label for="PetalLengthCm">Petal Length (cm):</label>
            <input type="number" step="0.1" name="PetalLengthCm" id="PetalLengthCm" required>

            <label for="PetalWidthCm">Petal Width (cm):</label>
            <input type="number" step="0.1" name="PetalWidthCm" id="PetalWidthCm" required>

            <button type="submit" class="button">Predict</button>
        </form>

        <!-- Display prediction result here -->
        <div id="prediction"></div>
    </div>
</body>
</html>
